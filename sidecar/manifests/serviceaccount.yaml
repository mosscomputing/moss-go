# ServiceAccounts for the MOSS sidecar.
#
#   moss-sidecar          — used by the standard Deployment; the RBAC Role
#                           grants pods get/list/delete + pods/eviction create
#                           so the authoritative client-go pod-delete path
#                           works (VAL-KILL-019, VAL-KILL-020 delete path).
#   moss-sidecar-nodelete — used by the RBAC-denied Deployment; bound to a
#                           Role that grants ONLY pods get/list (no delete), so
#                           the pod-delete returns Forbidden and the in-pod
#                           shareProcessNamespace SIGTERM->SIGKILL fallback
#                           must terminate the agent (VAL-KILL-028).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moss-sidecar
  namespace: moss-sidecar
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moss-sidecar-nodelete
  namespace: moss-sidecar
