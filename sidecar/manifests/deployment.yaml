# Example MOSS sidecar Deployment — AUTHORITATIVE pod-delete path enabled
# (the sidecar's ServiceAccount `moss-sidecar` has pods delete + eviction
# create RBAC via rbac.yaml).
#
# The pod runs with shareProcessNamespace: true so the sidecar can see and
# signal the sibling agent container's processes. The sidecar is a NATIVE
# sidecar: an init container with restartPolicy: Always, so it runs the
# revocation watcher for the whole lifetime of the pod.
#
# Substitute ${MOSS_API_URL}, ${MOSS_API_KEY}, ${MOSS_AGENT_ID} before
# applying, e.g. `envsubst < deployment.yaml | kubectl apply -f -`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moss-agent
  namespace: moss-sidecar
  labels:
    app: moss-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moss-agent
  template:
    metadata:
      labels:
        app: moss-agent
    spec:
      shareProcessNamespace: true
      serviceAccountName: moss-sidecar
      # Native sidecar: an init container that never completes because it
      # runs the revocation watcher loop. restartPolicy: Always keeps it
      # running alongside the main agent container.
      initContainers:
        - name: moss-sidecar
          image: moss-sidecar:dev
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          # The sidecar must signal the sibling agent process in the shared
          # PID namespace, which requires CAP_KILL and a uid permitted to
          # signal the target. Run as root so it can terminate an agent
          # running as any uid.
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["KILL"]
          env:
            - name: MOSS_API_URL
              value: "${MOSS_API_URL}"
            - name: MOSS_API_KEY
              value: "${MOSS_API_KEY}"
            - name: MOSS_AGENT_ID
              value: "${MOSS_AGENT_ID}"
            - name: MOSS_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MOSS_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Substring matched against /proc/*/cmdline to locate the sibling
            # agent process in the shared PID namespace.
            - name: MOSS_AGENT_CMDLINE_MATCH
              value: "sleep 3600"
            - name: MOSS_KILL_MODE
              value: "both"
            - name: MOSS_POLL_INTERVAL
              value: "1"
            - name: MOSS_SIGNAL_TERM_GRACE
              value: "2"
            - name: MOSS_KILL_DEADLINE
              value: "8"
      containers:
        # The non-embedding agent. In production this is the customer's agent
        # image; here it is a trivial long-running process the sidecar can
        # target. The sidecar terminates it on MOSS revocation.
        - name: moss-fake-agent
          image: busybox:1.36
          command: ["sleep", "3600"]
